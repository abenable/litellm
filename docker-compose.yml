services:
  litellm:
    image: docker.litellm.ai/berriai/litellm:main-stable
    command: >
      sh -c 'printf "%s\n" "$$LITELLM_CONFIG_CONTENT" > /tmp/litellm-config.yaml && litellm --config=/tmp/litellm-config.yaml'
    ports:
      - "4000:4000"
    environment:
      STORE_MODEL_IN_DB: "True"
      LITELLM_CONFIG_CONTENT: |
        model_list:
          - model_name: gemini-3.1-pro-preview
            litellm_params:
              model: gemini/gemini-3.1-pro-preview
              api_key: os.environ/GEMINI_API_KEY
          - model_name: gemini-3-flash-preview
            litellm_params:
              model: gemini/gemini-3-flash-preview
              api_key: os.environ/GEMINI_API_KEY
          - model_name: gemini-3.1-flash-lite
            litellm_params:
              model: gemini/gemini-3.1-flash-lite
              api_key: os.environ/GEMINI_API_KEY
          - model_name: kimi-k2.6
            litellm_params:
              model: cloudflare/@cf/moonshotai/kimi-k2.6
              api_key: os.environ/CLOUDFLARE_API_KEY
        litellm_settings:
          master_key: os.environ/LITELLM_MASTER_KEY
          database_url: os.environ/DATABASE_URL
          drop_params: true
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
