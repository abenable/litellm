services:
  litellm:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - "--config=/app/config.yaml"
      - "--port=4000"
    ports:
      - "4000:4000"
    environment:
      STORE_MODEL_IN_DB: "True"
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in Coolify}"
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in Coolify}"
      CLOUDFLARE_API_KEY: "${CLOUDFLARE_API_KEY:?Set CLOUDFLARE_API_KEY in Coolify}"
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
