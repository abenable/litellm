services:
  litellm:
    image: docker.litellm.ai/berriai/litellm:main-stable
    volumes:
      - ./config.yaml:/app/config.yaml
    command:
      - "--config=/app/config.yaml"
      - "--port=4000"
    ports:
      - "4000:4000"
    # Allows the container to reach the VM host via host.docker.internal
    # Use this in .env: DATABASE_URL=postgresql://postgres:PASSWORD@host.docker.internal:5432/litellm
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Optional: allows adding models via the proxy UI
      STORE_MODEL_IN_DB: "True"
    env_file:
      - .env
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
