    model_info:
      mode: chat
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.00001

  # Gemma 4 via Cloudflare Workers AI (OpenAI-compatible endpoint)
  - model_name: Gemma-4-26b
    litellm_params:
      model: openai/@cf/google/gemma-4-26b-a4b-it
