model_list:
  # Google AI Studio (Gemini API) - original
  - model_name: gemini-3.1-pro-preview
    litellm_params:
      model: gemini/gemini-3.1-pro-preview
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-3.5-flash
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-3.1-flash-lite
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY

  # Vertex AI (Agent Studio) - alternatives
  - model_name: gemini-3.1-pro-vertex
    litellm_params:
      model: vertex_ai/gemini-3.1-pro-preview
      vertex_location: "global"

  - model_name: gemini-3.5-flash-vertex
    litellm_params:
      model: vertex_ai/gemini-3.5-flash
      vertex_location: "global"

  - model_name: gemini-3.1-flash-lite-vertex
    litellm_params:
      model: vertex_ai/gemini-3.1-flash-lite
      vertex_location: "global"

  # Kimi K2.6 via Cloudflare Workers AI (OpenAI-compatible endpoint)
  - model_name: kimi-k2.6
    litellm_params:
      model: openai/@cf/moonshotai/kimi-k2.6
      api_key: os.environ/CLOUDFLARE_API_KEY
      api_base: https://api.cloudflare.com/client/v4/accounts/7db8ddd2e4eb60dc49a3c644f70e2908/ai/v1
    model_info:
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.00001

litellm_settings:
  drop_params: true
  vertex_project: "gen-lang-client-0134907437"

  # Vertex AI location for all Vertex models
  # Set per model above or remove to use default

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
