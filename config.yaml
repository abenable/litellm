model_list:
  # Google AI Studio (Gemini API) - original
  - model_name: gemini-3.1-pro-preview
    litellm_params:
      model: gemini/gemini-3.1-pro-preview
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-3.5-flash
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-3.1-flash-lite
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY

  # Vertex AI (Agent Studio) - alternatives
  - model_name: gemini-3.1-pro-vertex
    litellm_params:
      model: vertex_ai/gemini-3.1-pro-preview
      vertex_location: "global"

  - model_name: gemini-3.5-flash-vertex
    litellm_params:
      model: vertex_ai/gemini-3.5-flash
      vertex_location: "global"

  - model_name: gemini-3.1-flash-lite-vertex
    litellm_params:
      model: vertex_ai/gemini-3.1-flash-lite
      vertex_location: "global"

  # Kimi K2.6 via Cloudflare Workers AI (OpenAI-compatible endpoint)
  - model_name: kimi-k2.6
    litellm_params:
      model: openai/@cf/moonshotai/kimi-k2.6
      api_key: os.environ/CLOUDFLARE_API_KEY
      api_base: https://api.cloudflare.com/client/v4/accounts/7db8ddd2e4eb60dc49a3c644f70e2908/ai/v1
    model_info:
      # Pricing mapped to Anthropic Claude Haiku 4.5
      # Haiku 4.5: $1 / 1M input tokens, $5 / 1M output tokens
      base_model: claude-haiku-4-5
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000005

  # Anthropic model alias (for Claude Code compatibility)
  # Appears as claude-sonnet-4-6 but routes to Kimi K2.6
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: openai/@cf/moonshotai/kimi-k2.6
      api_key: os.environ/CLOUDFLARE_API_KEY
      api_base: https://api.cloudflare.com/client/v4/accounts/7db8ddd2e4eb60dc49a3c644f70e2908/ai/v1
    model_info:
      # Pricing mapped to Anthropic Claude Sonnet 4.6
      # Sonnet 4.6: $3 / 1M input tokens, $15 / 1M output tokens
      base_model: claude-sonnet-4-6
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015

litellm_settings:
  drop_params: true
  vertex_project: "gen-lang-client-0134907437"

  # Vertex AI location for all Vertex models
  # Set per model above or remove to use default

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
