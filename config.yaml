model_list:
  # Kimi K2.6 via Cloudflare Workers AI (OpenAI-compatible endpoint)
  - model_name: Mythos
    litellm_params:
      model: openai/@cf/moonshotai/kimi-k2.6
      api_key: os.environ/CLOUDFLARE_API_KEY
      api_base: https://api.cloudflare.com/client/v4/accounts/7db8ddd2e4eb60dc49a3c644f70e2908/ai/v1
    model_info:
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.00001

  # Kimi K2.7 Code via Cloudflare Workers AI (OpenAI-compatible endpoint)
  - model_name: Code
    litellm_params:
      model: openai/@cf/moonshotai/kimi-k2.7-code
