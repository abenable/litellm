model_list:
  # ============ Google Gemini Models (Official Endpoint) ============
  # Environment variable required:
  #   - GEMINI_API_KEY: Your Google AI Studio API key
  # Uses the official Google API endpoint: generativelanguage.googleapis.com

  - model_name: gemini-3.1-pro-preview
    litellm_params:
      model: gemini/gemini-3.1-pro-preview
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-3-flash-preview
    litellm_params:
      model: gemini/gemini-3-flash-preview
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-3.1-flash-lite
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY

  # ============ Cloudflare Workers AI ============
  # Environment variables required:
  #   - CLOUDFLARE_API_KEY: Your Cloudflare API token
  #   - CLOUDFLARE_ACCOUNT_ID: Your Cloudflare account ID
  #
  # Model docs: https://developers.cloudflare.com/workers-ai/models/kimi-k2.6/

  - model_name: kimi-k2.6
    litellm_params:
      model: cloudflare/@cf/moonshotai/kimi-k2.6
      api_key: os.environ/CLOUDFLARE_API_KEY
      # CLOUDFLARE_ACCOUNT_ID is read automatically from the environment

litellm_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  drop_params: true # Drop unsupported params gracefully
